<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Movimentação — EstoqueHosp</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏥%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/estilos/principal.css" />
  </head>
  <body>
    <header id="header"></header>

    <main id="conteudo">
      <div class="top">
        <div>
          <div class="eyebrow">Operação</div>
          <h2>Registro de entrada e saída</h2>
          <p class="sub">Registre a movimentação no momento em que ela acontece.</p>
        </div>
      </div>
      <form class="card" id="form-mov" style="max-width:640px" novalidate>
        <label style="margin-top:0">Tipo de movimentação</label>
        <div class="seg" id="seg-tipo">
          <button type="button" class="on">Entrada</button>
          <button type="button">Saída</button>
        </div>
        <label>Origem do registro</label>
        <div class="seg" id="seg-origem">
          <button type="button" class="on">Código de barras</button>
          <button type="button">Manual</button>
        </div>
        <label for="material">Material</label>
        <input class="field" id="material" placeholder="Leia o código ou busque pelo nome..." maxlength="120" autocomplete="off">
        <div class="fg">
          <div>
            <label for="quantidade">Quantidade</label>
            <input class="field" id="quantidade" type="number" min="1" max="100000" step="1" inputmode="numeric" placeholder="0">
          </div>
          <div>
            <label for="local">Local</label>
            <select class="field" id="local">
              <option>Almoxarifado A</option>
              <option>Almoxarifado B</option>
              <option>Centro Cirúrgico</option>
            </select>
          </div>
        </div>
        <div class="acts">
          <button class="btn" id="confirmar" type="submit">Confirmar movimentação</button>
        </div>
      </form>
    </main>
    <script type="module" src="src/paginas/movimentacao.js"></script>
  </body>
</html>
