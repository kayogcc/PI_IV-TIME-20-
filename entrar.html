<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Entrar — EstoqueHosp</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏥%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/estilos/principal.css" />
  </head>
  <body>
    <section class="login">
      <form class="box" id="form-login">
        <div class="logo">
          <i>
            <svg viewBox="0 0 24 24">
              <rect x="5" y="3" width="14" height="18" rx="2"/>
              <path d="M12 8v6M9 11h6M10 21v-3h4v3"/>
            </svg>
          </i>
          <span>Estoque<b>Hosp</b></span>
        </div>
        <h1>Bem-vinda de volta</h1>
        <p>Acesse a gestão de estoque do seu hospital.</p>
        <label>Perfil de acesso</label>
        <div class="roles" id="roles">
          <button class="role on" type="button">Almoxarifado</button>
          <button class="role" type="button">Centro Cirúrgico</button>
          <button class="role" type="button">Gestão</button>
        </div>
        <label for="mat">Usuário ou matrícula</label>
        <input class="field" id="mat" placeholder="Ex.: 104532" autocomplete="username">
        <label for="pw">Senha</label>
        <input class="field" id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
        <button class="btn" id="enter" type="submit">Entrar</button>
      </form>
    </section>
    <script type="module" src="/src/paginas/entrar.js"></script>
  </body>
</html>
